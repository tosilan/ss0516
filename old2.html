<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starry Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2980b9;
            --dark-color: #1a1a2e;
            --light-color: #f8f9fa;
            --accent-red: #e74c3c;
            --accent-black: #2c3e50;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #1a1a2e, #16213e, #0f3460, #1a1a2e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--light-color);
            min-height: 100vh;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: falling linear infinite;
            opacity: 0;
            animation-fill-mode: forwards;
        }

        @keyframes falling {
            0% {
                transform: translateY(-10px);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(100vh);
                opacity: 0;
            }
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem 2rem 12rem; /* 下部余白を12remに拡大 */
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary-color);
            margin-bottom: 1.5rem;
            box-shadow: 0 0 20px rgba(52, 152, 219, 0.5);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: var(--light-color);
        }

        .bio {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 2rem;
            line-height: 1.6;
            max-width: 80%;
        }

        .buttons {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-top: 2rem;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 4px 30px rgba(0, 0, 0, 0.1),
                0 0 10px rgba(255, 255, 255, 0.1) inset;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 
                0 8px 40px rgba(0, 0, 0, 0.2),
                0 0 15px rgba(255, 255, 255, 0.2) inset;
        }

        .btn-instagram {
            background: linear-gradient(
                45deg,
                rgba(64, 93, 230, 0.7),
                rgba(88, 81, 219, 0.7),
                rgba(131, 58, 180, 0.7),
                rgba(193, 53, 132, 0.7),
                rgba(225, 48, 108, 0.7),
                rgba(253, 29, 29, 0.7)
            );
            color: white;
        }

        .btn-red {
            background-color: rgba(231, 76, 60, 0.7);
            color: white;
        }

        .btn-black {
            background-color: rgba(44, 62, 80, 0.7);
            color: white;
        }

        .btn i {
            margin-right: 10px;
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1.5rem 1.5rem 10rem; /* モバイルの下部余白を10remに */
            }
            
            .profile-pic {
                width: 120px;
                height: 120px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .bio {
                font-size: 1rem;
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="stars-container" id="stars-container"></div>
    
    <div class="container">
        <img src="./images/photo.png" alt="Profile Picture" class="profile-pic">
        <h1>pg9yn</h1>
        <p class="bio">動画編集と素人プログラマー</p>
        
        <div class="buttons">
            <a href="https://instagram.com/pg9yn/" class="btn btn-instagram">
                <i class="fab fa-instagram"></i> メイン垢
            </a>
            <a href="https://instagram.com/ps9kr/" class="btn btn-instagram">
                <i class="fab fa-instagram"></i> サブ垢
            </a>
            <a href="https://www.wh00.ooo/users/pg9yn?fbclid=PAZXh0bgNhZW0CMTEAAabW7g3AabM46rDNmfpOVpROmiKfKvq7cuTHVcribeSSDHqXdAwgA7nNyvU_aem_hqWwHvGo2feu8ApCw8luKA" class="btn btn-black">
                <i class="fas fa-earth"></i> whoo
            </a>
            <a href="https://music.apple.com/profile/souta_0516" class="btn btn-red">
                <i class="fas fa-music"></i> Apple Music
            </a>
        </div>
    </div>

    <script>
        function createStars() {
            const container = document.getElementById('stars-container');
            const starCount = 100;
            
            container.innerHTML = '';
            
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                
                const size = Math.random() * 2 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                
                star.style.left = `${Math.random() * width}px`;
                star.style.top = `${Math.random() * height}px`;
                
                star.style.opacity = Math.random() * 0.8 + 0.2;
                
                const duration = Math.random() * 10 + 5;
                const delay = Math.random() * 5;
                star.style.animationDuration = `${duration}s`;
                star.style.animationDelay = `${delay}s`;
                
                container.appendChild(star);
            }
        }
        
        window.addEventListener('load', () => {
            createStars();
            setInterval(() => {
                createStars();
            }, 10000);
        });
        
        window.addEventListener('resize', createStars);
    </script>
</body>
</html>
