<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ss516.f5.si</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #2c3e50;
            --card-color: #ffffff;
            --metal-color: #e0e0e0;
            --accent-color: #58626c;
            --secondary-color: #7f8c8d;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --metal-gradient: linear-gradient(145deg, #e0e0e0, #f5f5f5);
            --border-radius: 16px;
            --chart-text: #2c3e50;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --text-color: #e0e0e0;
                --card-color: #1e1e1e;
                --metal-color: #2a2a2a;
                --accent-color: #9e9e9e;
                --secondary-color: #b0b0b0;
                --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
                --metal-gradient: linear-gradient(145deg, #2a2a2a, #1e1e1e);
                --chart-text: #e0e0e0;
            }
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: all 0.4s ease;
            line-height: 1.7;
            background-image: radial-gradient(circle at 10% 20%, rgba(0,0,0,0.02) 0%, rgba(0,0,0,0.02) 90%);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .profile-card {
            background: var(--metal-gradient);
            border-radius: var(--border-radius);
            padding: 3rem;
            box-shadow: var(--shadow);
            margin-bottom: 3rem;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #7f7f7f, #e0e0e0, #7f7f7f);
            opacity: 0.3;
        }

        .profile-header {
            display: flex;
            align-items: center;
            margin-bottom: 2rem;
        }

        .profile-icon {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 2rem;
            background: linear-gradient(135deg, #7f7f7f, #e0e0e0);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2.5rem;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            border: 2px solid rgba(255,255,255,0.3);
        }

        .profile-info h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--text-color);
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .profile-info .username {
            margin: 0.5rem 0 0;
            color: var(--secondary-color);
            font-size: 1.2rem;
            letter-spacing: 0.5px;
        }

        .bio {
            margin-bottom: 3rem;
            font-size: 1.15rem;
            line-height: 1.8;
            color: var(--text-color);
            padding: 0 0.5rem;
        }

        .button-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 3rem;
            justify-content: flex-start;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: none;
            cursor: pointer;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, #58626c, #3a424a);
            color: white;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
            color: var(--text-color);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            opacity: 0.95;
        }

        .btn i {
            margin-right: 10px;
            font-size: 1.2rem;
        }

        .section-title {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            color: var(--text-color);
            position: relative;
            padding-bottom: 0.5rem;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50px;
            height: 3px;
            background: linear-gradient(90deg, #7f7f7f, #e0e0e0);
            border-radius: 3px;
        }

        .section-title i {
            margin-right: 12px;
            color: var(--accent-color);
        }

        .chart-container {
            position: relative;
            height: 350px;
            margin-bottom: 3rem;
            background: rgba(255,255,255,0.05);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.1);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
            padding: 0.7rem 1.2rem;
            border-radius: 50px;
            font-size: 0.95rem;
            margin-right: 1rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .badge i {
            margin-right: 8px;
            color: var(--accent-color);
        }

        .stats-description {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(5px);
            padding: 1.5rem;
            border-radius: var(--border-radius);
            margin-top: 2rem;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        @media (max-width: 768px) {
            .profile-header {
                flex-direction: column;
                text-align: center;
            }

            .profile-icon {
                margin-right: 0;
                margin-bottom: 1.5rem;
            }

            .button-container {
                justify-content: center;
                flex-direction: column;
                align-items: center;
                padding: 0;
                width: 100%;
            }

            .btn {
                width: 90%;
                max-width: 300px;
                margin: 0.5rem 0;
                padding: 0.8rem 1rem;
                font-size: 0.9rem;
            }

            .container {
                padding: 1rem;
            }

            .profile-card {
                padding: 1.5rem;
                margin: 0.5rem 0;
                border-radius: 12px;
            }

            .chart-container {
                height: 280px;
                padding: 0.5rem;
                margin: 1rem 0;
            }

            .section-title {
                font-size: 1.3rem;
                margin-top: 1.5rem;
            }

            .bio {
                font-size: 1rem;
                line-height: 1.6;
                padding: 0;
                text-align: center;
            }

            .stats-description {
                margin: 1rem 0;
                padding: 1rem;
                font-size: 0.95rem;
            }

            .chart-container canvas {
                max-height: 250px;
            }
        }

        @media (max-width: 480px) {
            .chart-container {
                height: 220px;
                padding: 0.25rem;
            }

            .section-title {
                font-size: 1.2rem;
            }

            .profile-icon {
                width: 80px;
                height: 80px;
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-card">
            <div class="profile-header">
                <img src="./images/icon.png" alt="アイコン" class="profile-icon">
                <div class="profile-info">
                    <h1>そうた</h1>

            <div class="section-title">
                <i class="fas fa-chart-bar"></i> サービス統計
            </div>

            <div class="chart-container">
                <canvas id="myChart"></canvas>
            </div>

            <div class="stats-description">
                <p>私が開発したオンラインサービスの登録ユーザー数が5,700人を突破しました。この成長は、自分の実力を発揮できた気がします。</p>
            </div>

            <div class="section-title" style="margin-top: 3rem;">
                <i class="fas fa-award"></i> 公式認定
            </div>

            <div class="badge">
                <i class="fas fa-check-circle"></i> CapCut公式クリエイター
            </div>
            <div class="stats-description" style="margin-top: 1.5rem;">
                <p>CapCutの公式クリエイタープログラムに選出され、プラットフォーム上で認定バッジを保持しています。プロフェッショナルな動画編集技術が公式に認められています。</p>
            </div>
        </div>
    </div>

    <script>
        // テーマ設定に基づいてグラフの色を更新
        const updateChartColors = (isDark) => {
            if (window.myChart) {
                // グラフのテキスト色更新
                window.myChart.options.plugins.legend.labels.color = isDark ? '#e0e0e0' : '#2c3e50';
                window.myChart.options.plugins.datalabels.color = isDark ? '#e0e0e0' : '#2c3e50';

                // グラフの色を更新
                window.myChart.data.datasets[0].backgroundColor = isDark ? 
                    'rgba(200, 200, 200, 0.2)' : 
                    'rgba(88, 98, 108, 0.2)';

                window.myChart.data.datasets[0].borderColor = isDark ? 
                    'rgba(200, 200, 200, 1)' : 
                    'rgba(88, 98, 108, 1)';

                // ツールチップのスタイルを更新
                window.myChart.options.plugins.tooltip.backgroundColor = isDark ? 
                    'rgba(40, 40, 40, 0.9)' : 
                    'rgba(255, 255, 255, 0.9)';
                window.myChart.options.plugins.tooltip.titleColor = isDark ? 
                    '#ffffff' : '#2c3e50';
                window.myChart.options.plugins.tooltip.bodyColor = isDark ? 
                    '#e0e0e0' : '#2c3e50';

                window.myChart.update();
            }
        };

        // システムのカラースキーム変更を監視
        const colorSchemeMedia = window.matchMedia('(prefers-color-scheme: dark)');

        const handleColorSchemeChange = (e) => {
            updateChartColors(e.matches);
        };

        // 初期設定とリスナー登録
        const initTheme = () => {
            updateChartColors(colorSchemeMedia.matches);
            colorSchemeMedia.addListener(handleColorSchemeChange);
        };

        // グラフの作成
        const createChart = () => {
            const ctx = document.getElementById('myChart').getContext('2d');

            // 影効果を追加するプラグイン
            const shadowPlugin = {
                id: 'customShadow',
                beforeDraw: (chart) => {
                    const ctx = chart.ctx;
                    ctx.save();
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
                    ctx.shadowBlur = 10;
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 5;
                },
                afterDraw: (chart) => {
                    chart.ctx.restore();
                }
            };

            window.myChart = new Chart(ctx, {
                type: 'line',
                plugins: [shadowPlugin, ChartDataLabels],
                data: {
                    labels: ['1月', '2月', '3月', '4月', '5月', '6月'],
                    datasets: [{
                        label: 'ユーザー数推移',
                        data: [1200, 2300, 3100, 3500, 4200, 5700],
                        backgroundColor: 'rgba(88, 98, 108, 0.2)',
                        borderColor: 'rgba(88, 98, 108, 1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: {
                        padding: {
                            top: 15,
                            bottom: 15,
                            left: 10,
                            right: 10
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                color: getComputedStyle(document.documentElement).getPropertyValue('--chart-text'),
                                font: {
                                    family: "'Helvetica Neue', Helvetica, Arial, sans-serif",
                                    size: window.innerWidth < 768 ? 12 : 14
                                },
                                padding: 20,
                                usePointStyle: true,
                                pointStyle: 'circle'
                            }
                        },
                        tooltip: {
                            bodyFont: {
                                family: "'Helvetica Neue', Helvetica, Arial, sans-serif",
                                size: window.innerWidth < 768 ? 12 : 14
                            },
                            titleFont: {
                                family: "'Helvetica Neue', Helvetica, Arial, sans-serif",
                                size: window.innerWidth < 768 ? 14 : 16,
                                weight: 'bold'
                            },
                            cornerRadius: 10,
                            displayColors: true,
                            usePointStyle: true,
                            boxPadding: 6
                        },
                        datalabels: {
                            display: window.innerWidth > 480,
                            color: getComputedStyle(document.documentElement).getPropertyValue('--chart-text'),
                            font: {
                                weight: 'bold',
                                size: window.innerWidth < 768 ? 10 : 12
                            },
                            formatter: (value) => {
                                return Math.round(value / 57) + '%';
                            },
                            textShadowColor: 'rgba(0, 0, 0, 0.2)',
                            textShadowBlur: 2
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                font: {
                                    size: window.innerWidth < 768 ? 10 : 12
                                }
                            }
                        },
                        x: {
                            ticks: {
                                font: {
                                    size: window.innerWidth < 768 ? 10 : 12
                                }
                            }
                        }
                    },
                    animation: {
                        animateScale: true,
                        animateRotate: true,
                        duration: 1500
                    }
                }
            });
        };

        // ウィンドウリサイズ時のグラフ調整
        window.addEventListener('resize', () => {
            if (window.myChart) {
                window.myChart.update();
            }
        });

        // DOM読み込み後に初期化
        document.addEventListener('DOMContentLoaded', () => {
            createChart();
            initTheme();
        });
    </script>
</body>
</html>
